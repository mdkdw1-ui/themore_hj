name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Add Android Platform
      run: cordova platform add android

    # ⭐ 추가: res/values/strings.xml 파일을 복사하여 안드로이드 리소스에 반영
    - name: Copy strings.xml to Android resources
      run: |
        mkdir -p platforms/android/app/src/main/res/values
        cp res/values/strings.xml platforms/android/app/src/main/res/values/strings.xml
        echo "✅ strings.xml 복사 완료"

    - name: Build Android App (Debug APK)
      run: cordova build android --debug

    # ⭐ 추가: 빌드 후 strings.xml 확인 및 수정 (안전장치)
    - name: Verify and fix app name in strings.xml
      run: |
        if [ -f "platforms/android/app/src/main/res/values/strings.xml" ]; then
          echo "📁 현재 strings.xml 내용:"
          cat platforms/android/app/src/main/res/values/strings.xml
          
          # app_name이 "The More for HJ"인지 확인하고, 아니면 수정
          if grep -q '<string name="app_name">The More for HJ</string>' platforms/android/app/src/main/res/values/strings.xml; then
            echo "✅ 앱 이름이 정상적으로 설정되어 있습니다: The More for HJ"
          else
            echo "⚠️ 앱 이름이 다릅니다. 수정합니다..."
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">The More for HJ<\/string>/g' platforms/android/app/src/main/res/values/strings.xml
            echo "✅ 앱 이름을 'The More for HJ'로 수정했습니다."
          fi
          
          # search_hint 확인
          if grep -q 'search_hint' platforms/android/app/src/main/res/values/strings.xml; then
            echo "✅ search_hint가 설정되어 있습니다."
          else
            echo "⚠️ search_hint가 없습니다. 추가합니다..."
            echo '    <string name="search_hint">더모아현주, 더모어현주</string>' >> platforms/android/app/src/main/res/values/strings.xml
            echo "✅ search_hint를 추가했습니다."
          fi
        fi

    # ⭐ 추가: AndroidManifest.xml도 확인
    - name: Verify AndroidManifest.xml
      run: |
        if [ -f "platforms/android/app/src/main/AndroidManifest.xml" ]; then
          echo "📁 AndroidManifest.xml 확인:"
          grep 'android:label' platforms/android/app/src/main/AndroidManifest.xml || echo "⚠️ android:label을 찾을 수 없습니다."
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TheMore-HJ-APK
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk

    - name: 생성된 APK 파일 저장하기
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: platforms/android/app/build/outputs/apk/**/*.apk
